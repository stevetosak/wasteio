spring.application.name=wasteio-api

# PostgreSQL Configuration
spring.datasource.url=${DB_URL}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# MQTT Configuration
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.broker.host=${MQTT_HOST:localhost}
mqtt.broker.port=${MQTT_PORT:1883}
mqtt.client.id=wasteio-backend
mqtt.username=${MQTT_USERNAME:wasteio-backend}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic.telemetry=waste/devices/+/telemetry
mqtt.topic.events=waste/devices/+/events

simulator.devices.path=${SIMULATOR_DEVICES_PATH:/app/devices.json}
simulator.control.url=${SIMULATOR_URL:http://localhost:8090}


# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Device health check
device.healthcheck.interval.ms=15000
device.healthcheck.initial-delay.ms=5000